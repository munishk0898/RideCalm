name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk RideCalm.apk
          cp app/build/outputs/apk/debug/app-debug.apk RideCalm-debug.apk
          ls -l RideCalm.apk RideCalm-debug.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump permissions RideCalm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideCalm-apks
          path: |
            RideCalm.apk
            RideCalm-debug.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RideCalm build ${{ github.run_number }}
          files: |
            RideCalm.apk
            RideCalm-debug.apk
          prerelease: true
